<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekend Wars · Münster</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,Arial;background:#09090b;color:#f5f5f5}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #fa5a60;outline-offset:2px}.shell{max-width:1100px;margin:auto;min-height:100vh;padding:24px 22px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #29292d;padding-bottom:20px}.logo{font-weight:900;letter-spacing:.18em;font-size:13px}.logo b{color:#ef4444}.muted{color:#a1a1aa}.small{font-size:12px}.pill{border:1px solid #464047;border-radius:100px;padding:8px 12px;font-size:12px;background:#1c1719}.hero{padding:36px 0 22px}.eyebrow{color:#ef666a;font-size:11px;letter-spacing:.2em;font-weight:800;text-transform:uppercase}h1{font-size:clamp(30px,6vw,52px);letter-spacing:-.05em;line-height:1.08;margin:10px 0}h2{font-size:21px;letter-spacing:-.03em;margin:0 0 14px}h3{font-size:16px;margin:0 0 8px}.sub{color:#aaaab0;line-height:1.55;max-width:650px}.tabs{display:flex;gap:6px;overflow:auto;border-bottom:1px solid #28282d;margin:12px 0 26px}.tab{background:none;border:0;color:#aaaab0;padding:14px 16px;white-space:nowrap;border-bottom:2px solid transparent}.tab.active{color:white;border-color:#ef4444}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:#151518;border:1px solid #2c2c31;border-radius:16px;padding:20px;margin-bottom:16px}.feature{background:linear-gradient(115deg,#281216,#141417 70%);border-color:#59252c}.meta{font-size:12px;color:#a1a1aa}.red{color:#fa696f}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:flex;flex-direction:column;gap:12px}.btn{background:#e33d47;color:white;border:1px solid #e33d47;padding:11px 15px;border-radius:9px;font-weight:750}.btn.secondary{background:#242428;border-color:#44444a}.btn.ghost{background:transparent;border-color:#4d3337;color:#ff858a}.btn:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.tag{display:inline-block;background:#302025;color:#ff999d;border:1px solid #573037;border-radius:6px;padding:5px 8px;font-size:11px;font-weight:700}.entry{border-top:1px solid #2c2c30;padding:16px 0}.entry:first-child{border-top:0;padding-top:0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:700;color:#d4d4d8}input,textarea,select{width:100%;background:#0c0c0f;border:1px solid #3b3b41;border-radius:9px;padding:11px;color:#fff}textarea{min-height:85px;resize:vertical}.wide{grid-column:1/-1}.notice{background:#211c1e;border-left:3px solid #ef4444;padding:14px;border-radius:6px;color:#d5cdd0;font-size:13px;line-height:1.5}.empty{color:#a1a1aa;padding:25px 0}.stat{font-size:28px;font-weight:800;margin:8px 0}.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.dialog{background:#18181b;border:1px solid #494950;border-radius:18px;padding:24px;width:min(580px,100%);max-height:90vh;overflow:auto}.hidden{display:none}.foot{font-size:12px;color:#85858c;margin-top:28px}a{color:#ff858a}@media(max-width:650px){.shell{padding:18px 15px 90px}.grid,.formgrid{grid-template-columns:1fr}.hero{padding-top:25px}.card{padding:16px}.top{align-items:flex-start}.row.wrap{flex-wrap:wrap}.tab{padding:12px 13px}}
</style></head><body><div id="app" class="shell"></div><div id="modal" class="modal hidden"><div class="dialog" id="dialog"></div></div><script>
(()=>{'use strict';
const KEY='ww_muenster_v6';const seed={admin:false,tab:'home',chapter:1,activities:[{id:'a1',name:'Aankomst in Münster',place:'Verblijf in Münster',day:'Vrijdag',time:'18:00',type:'Aankomst',secret:false},{id:'a2',name:'Stad verkennen',place:'Prinzipalmarkt',day:'Zaterdag',time:'11:00',type:'Stadsspel',secret:false},{id:'a3',name:'Avondprogramma',place:'Kuhviertel',day:'Zaterdag',time:'20:00',type:'Uitgaan',secret:true},{id:'a4',name:'De ontknoping',place:'Verblijf in Münster',day:'Zondag',time:'11:00',type:'Finale',secret:false}],missions:[{id:'m1',title:'De eerste getuige',description:'Maak een groepsfoto op de locatie van de eerste stadschallenge.',points:75,activityId:'a2',check:'Spelleider',reward:'Aanwijzing'},{id:'m2',title:'Het verboden woord',description:'Laat een andere speler spontaan het woord legendarisch zeggen.',points:100,activityId:'',check:'Getuige',reward:'Punten'},{id:'m3',title:'Het geheime bericht',description:'Los de code op: welke stad staat centraal in dit onderzoek?',points:50,activityId:'a1',check:'Automatische code',answer:'MUNSTER',reward:'Aanwijzing'}],submissions:[],pack:[{id:'p1',text:'Identiteitsbewijs',done:false},{id:'p2',text:'Kleding voor het weekend',done:false},{id:'p3',text:'Toiletspullen',done:false},{id:'p4',text:'Oplader',done:false},{id:'p5',text:'Goede wandelschoenen',done:false}],score:0};
let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){state=JSON.parse(JSON.stringify(seed))}for(const k of Object.keys(seed))if(!(k in state))state[k]=JSON.parse(JSON.stringify(seed[k]));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Opslaan is niet mogelijk in deze browser.')}};const uid=()=>Math.random().toString(36).slice(2,10);const act=id=>state.activities.find(a=>a.id===id);const scene=a=>a?`Het onderzoek leidt naar ${a.place}. Tijdens ‘${a.name}’ verschijnt een nieuw spoor.`:'Er is nog geen activiteit gekoppeld.';const activeMission=m=>state.submissions.find(s=>s.missionId===m.id&&s.status==='pending');const approved=m=>state.submissions.find(s=>s.missionId===m.id&&s.status==='approved');
function render(){const tab=state.tab;document.getElementById('app').innerHTML=`<header class="top"><div><div class="logo">WEEKEND <b>WARS</b></div><div class="meta">MURDER MYSTERY / MÜNSTER</div></div><button class="pill" data-action="admin">${state.admin?'◆ Beheermodus':'◇ Deelnemermodus'}</button></header><section class="hero"><div class="eyebrow">De zaak begint vóór vertrek</div><h1>Een weekend.<br><span class="red">Niemand onschuldig.</span></h1><div class="sub">Jouw planning, geheime missies en een moordmysterie dat meebeweegt met de locaties van jullie vriendenweekend.</div></section><nav class="tabs" aria-label="Navigatie">${[['home','Overzicht'],['planning','Planning'],['missions','Missies'],['dossier','Dossier'],['pack','Paklijst'],['admin','Beheer']].filter(x=>x[0]!=='admin'||state.admin).map(([id,n])=>`<button class="tab ${tab===id?'active':''}" data-tab="${id}">${n}</button>`).join('')}</nav><main>${({home:home,planning:planning,missions:missions,dossier:dossier,pack:pack,admin:adminPage}[tab]||home)()}</main><div class="foot">Prototype 6.0 · Wijzigingen worden alleen in deze browser bewaard. Geen online multiplayer of echte gebruikersbeveiliging.</div>`}
function home(){const next=state.activities[0];return `<div class="grid"><div class="card feature"><div class="eyebrow">Het onderzoek</div><h2 style="margin-top:12px">Operatie Blackout</h2><p class="sub">Een fictieve moord. De deelnemers zijn verdachten. Verzamel bewijs, sluit mogelijkheden uit en ontmasker de dader tijdens de finale.</p><span class="tag">Hoofdstuk ${state.chapter} van 3</span><div class="actions"><button class="btn" data-tab="dossier">Open onderzoeksdossier</button></div></div><div class="card"><div class="eyebrow">Weekend in cijfers</div><div class="grid" style="margin-top:14px"><div><div class="meta">Activiteiten</div><div class="stat">${state.activities.length}</div></div><div><div class="meta">Missies</div><div class="stat">${state.missions.length}</div></div><div><div class="meta">Punten</div><div class="stat">${state.score}</div></div><div><div class="meta">In afwachting</div><div class="stat">${state.submissions.filter(s=>s.status==='pending').length}</div></div></div></div></div><div class="card"><h2>Komende activiteiten</h2>${state.activities.filter(a=>state.admin||!a.secret).slice(0,3).map(a=>`<div class="entry"><div class="row"><strong>${esc(a.name)}</strong><span class="tag">${esc(a.day)} ${esc(a.time)}</span></div><div class="meta" style="margin-top:5px">⌖ ${esc(a.place)}</div></div>`).join('')||'<div class="empty">Nog geen activiteiten.</div>'}<button class="btn secondary" data-tab="planning">Bekijk de planning</button></div>`}
function planning(){return `<div class="row wrap"><h2>Weekendplanning</h2>${state.admin?'<button class="btn" data-edit-activity="new">+ Activiteit toevoegen</button>':''}</div><p class="sub">De locaties in je planning bepalen waar gekoppelde verhaalscènes en missies zich afspelen.</p>${state.activities.filter(a=>state.admin||!a.secret).map(a=>`<div class="card"><div class="row wrap"><div><span class="tag">${esc(a.day)} · ${esc(a.time)}</span>${a.secret?'<span class="tag" style="margin-left:6px">Verborgen</span>':''}<h3 style="margin-top:12px">${esc(a.name)}</h3><div class="muted">⌖ ${esc(a.place)}</div><div class="meta" style="margin-top:8px">${esc(a.type)}</div></div>${state.admin?`<div class="actions"><button class="btn secondary" data-edit-activity="${esc(a.id)}">Bewerken</button><button class="btn ghost" data-delete-activity="${esc(a.id)}">Verwijderen</button></div>`:''}</div></div>`).join('')||'<div class="empty">Nog geen activiteiten gepland.</div>'}`}
function missions(){return `<div class="row wrap"><h2>Missies en challenges</h2>${state.admin?'<button class="btn" data-edit-mission="new">+ Missie toevoegen</button>':''}</div><p class="sub">Locatiegebonden missies volgen automatisch de bijbehorende activiteit. Punten worden pas toegekend na controle.</p>${state.missions.map(m=>{let a=act(m.activityId),pending=activeMission(m),done=approved(m);return `<div class="card"><div class="row wrap"><h3>${esc(m.title)}</h3><span class="tag">+${Number(m.points)||0} punten · ${esc(m.reward)}</span></div><p class="sub">${esc(m.description)}</p><div class="meta">⌖ ${a?esc(a.place):'Overal uitvoerbaar'} · Controle: ${esc(m.check)}</div>${a?`<div class="notice" style="margin-top:12px">${esc(scene(a))}</div>`:''}<div class="actions">${state.admin?`<button class="btn secondary" data-edit-mission="${esc(m.id)}">Bewerken</button><button class="btn ghost" data-delete-mission="${esc(m.id)}">Verwijderen</button>`:`<button class="btn" ${pending||done?'disabled':''} data-submit="${esc(m.id)}">${done?'Goedgekeurd':pending?'Wacht op controle':'Missie indienen'}</button>`}</div></div>`}).join('')||'<div class="empty">Nog geen missies toegevoegd.</div>'}`}
function dossier(){return `<div class="card feature"><div class="eyebrow">Vertrouwelijk dossier</div><h2 style="margin-top:12px">De zaak van Münster</h2><p class="sub">Een fictieve moord brengt de vriendengroep onder verdenking. Iedere activiteit kan een nieuwe plaats delict, getuigenverklaring of aanwijzing onthullen.</p><span class="tag">Hoofdstuk ${state.chapter}</span></div><h2>Locaties in het verhaal</h2>${state.activities.map((a,i)=>`<div class="card"><div class="eyebrow">Scène ${i+1} · ${esc(a.day)}</div><h3 style="margin-top:10px">${esc(a.place)}</h3><p class="sub">${esc(scene(a))}</p></div>`).join('')}<div class="notice">De scènes zijn dynamisch gekoppeld aan de planning. De volledige sluitende dader-wapen-locatie-puzzel is nog niet geïmplementeerd in deze versie; wijzigingen aan activiteiten veranderen dus geen geheime oplossing.</div>`}
function pack(){return `<div class="row wrap"><h2>Paklijst</h2>${state.admin?'<button class="btn" data-add-pack="1">+ Item toevoegen</button>':''}</div><div class="card">${state.pack.map(p=>`<div class="entry row"><label style="display:flex;flex-direction:row;align-items:center;gap:12px;font-size:14px"><input type="checkbox" style="width:18px" data-pack="${esc(p.id)}" ${p.done?'checked':''}><span style="${p.done?'text-decoration:line-through;color:#888':''}">${esc(p.text)}</span></label>${state.admin?`<button class="btn ghost" data-remove-pack="${esc(p.id)}">Verwijder</button>`:''}</div>`).join('')||'<div class="empty">De lijst is leeg.</div>'}</div>`}
function adminPage(){if(!state.admin)return home();let pending=state.submissions.filter(s=>s.status==='pending');return `<div class="row wrap"><h2>Organisatiecentrum</h2><span class="tag">BEHEER</span></div><div class="notice">Dit is een demonstratiebeheermodus, geen beveiligde login. Voor echte spelers bouwen we later accounts en rechten.</div><div class="grid" style="margin-top:16px"><div class="card"><h3>Planning beheren</h3><p class="sub">Activiteiten en locaties toevoegen of aanpassen.</p><button class="btn" data-tab="planning">Open planning</button></div><div class="card"><h3>Missies beheren</h3><p class="sub">Opdrachten, controle en beloningen aanpassen.</p><button class="btn" data-tab="missions">Open missies</button></div></div><div class="card"><h2>Wacht op goedkeuring (${pending.length})</h2>${pending.map(s=>{let m=state.missions.find(x=>x.id===s.missionId);return `<div class="entry"><strong>${esc(m?.title||'Verwijderde missie')}</strong><p class="sub">Ingezonden bewijs: ${esc(s.evidence)}</p><div class="actions"><button class="btn" data-review="${esc(s.id)}:approved">Goedkeuren</button><button class="btn ghost" data-review="${esc(s.id)}:rejected">Afkeuren</button></div></div>`}).join('')||'<div class="empty">Geen inzendingen om te beoordelen.</div>'}</div><div class="card"><h3>Verhaalhoofdstuk</h3><p class="sub">Huidig hoofdstuk: ${state.chapter}</p><div class="actions"><button class="btn secondary" data-chapter="prev">Vorig hoofdstuk</button><button class="btn" data-chapter="next">Volgend hoofdstuk</button></div></div><div class="card"><h3>Back-up</h3><p class="sub">Download je planning, missies en voortgang als JSON-bestand.</p><button class="btn secondary" data-export="1">Exporteer gegevens</button></div>`}
function openModal(html){document.getElementById('dialog').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
function editActivity(id){let a=id==='new'?{id:uid(),name:'',place:'',day:'Vrijdag',time:'18:00',type:'Activiteit',secret:false}:act(id);if(!a)return;openModal(`<h2>${id==='new'?'Activiteit toevoegen':'Activiteit bewerken'}</h2><form id="activityForm" class="formgrid"><label class="wide">Naam activiteit<input name="name" maxlength="100" required value="${esc(a.name)}"></label><label class="wide">Locatie<input name="place" maxlength="120" required value="${esc(a.place)}"></label><label>Dag<select name="day">${['Vrijdag','Zaterdag','Zondag','Anders'].map(x=>`<option ${x===a.day?'selected':''}>${x}</option>`).join('')}</select></label><label>Tijd<input type="time" name="time" value="${esc(a.time)}" required></label><label class="wide">Soort activiteit<input name="type" maxlength="80" value="${esc(a.type)}"></label><label class="wide" style="flex-direction:row;align-items:center"><input type="checkbox" style="width:18px" name="secret" ${a.secret?'checked':''}>Verborgen voor deelnemers</label><div class="actions wide"><button type="submit" class="btn">Opslaan</button><button type="button" class="btn secondary" data-close="1">Annuleren</button></div></form>`);document.getElementById('activityForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);let obj={id:a.id,name:String(f.get('name')).trim(),place:String(f.get('place')).trim(),day:String(f.get('day')),time:String(f.get('time')),type:String(f.get('type')),secret:f.has('secret')};if(!obj.name||!obj.place)return;let ix=state.activities.findIndex(x=>x.id===a.id);if(ix<0)state.activities.push(obj);else state.activities[ix]=obj;save();closeModal();render()}}
function editMission(id){let m=id==='new'?{id:uid(),title:'',description:'',points:50,activityId:'',check:'Spelleider',reward:'Punten',answer:''}:state.missions.find(x=>x.id===id);if(!m)return;openModal(`<h2>${id==='new'?'Missie toevoegen':'Missie bewerken'}</h2><form id="missionForm" class="formgrid"><label class="wide">Titel<input name="title" maxlength="100" required value="${esc(m.title)}"></label><label class="wide">Opdrachtomschrijving<textarea name="description" maxlength="1200" required>${esc(m.description)}</textarea></label><label>Punten<input name="points" type="number" min="0" max="1000" required value="${Number(m.points)}"></label><label>Beloning<select name="reward">${['Punten','Aanwijzing','Punten + aanwijzing'].map(x=>`<option ${x===m.reward?'selected':''}>${x}</option>`).join('')}</select></label><label class="wide">Koppel aan activiteit<select name="activityId"><option value="">Geen specifieke locatie</option>${state.activities.map(a=>`<option value="${esc(a.id)}" ${a.id===m.activityId?'selected':''}>${esc(a.name)} — ${esc(a.place)}</option>`).join('')}</select></label><label class="wide">Controle<select name="check">${['Spelleider','Getuige','Automatische code'].map(x=>`<option ${x===m.check?'selected':''}>${x}</option>`).join('')}</select></label><label class="wide">Juiste code (alleen voor automatische controle)<input name="answer" maxlength="80" value="${esc(m.answer||'')}"></label><div class="actions wide"><button class="btn" type="submit">Opslaan</button><button class="btn secondary" type="button" data-close="1">Annuleren</button></div></form>`);document.getElementById('missionForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),o={id:m.id,title:String(f.get('title')).trim(),description:String(f.get('description')).trim(),points:Number(f.get('points')),reward:String(f.get('reward')),activityId:String(f.get('activityId')),check:String(f.get('check')),answer:String(f.get('answer')).trim()};if(!o.title||!o.description||o.points<0||o.points>1000)return;if(o.check==='Automatische code'&&!o.answer){alert('Vul een controlecode in.');return}let ix=state.missions.findIndex(x=>x.id===m.id);if(ix<0)state.missions.push(o);else state.missions[ix]=o;save();closeModal();render()}}
function submitMission(id){let m=state.missions.find(x=>x.id===id);if(!m||approved(m)||activeMission(m))return;openModal(`<h2>${esc(m.title)}</h2><p class="sub">${esc(m.description)}</p><div class="notice">${m.check==='Automatische code'?'Voer de juiste code in. De app controleert het antwoord.':'Omschrijf wat je hebt gedaan. De inzending wordt pas na goedkeuring beloond.'}</div><form id="submitForm" class="stack" style="margin-top:16px"><label>${m.check==='Automatische code'?'Code':'Bewijs of getuigenverklaring'}<textarea name="evidence" maxlength="600" required></textarea></label><div class="actions"><button class="btn" type="submit">Indienen</button><button class="btn secondary" type="button" data-close="1">Annuleren</button></div></form>`);document.getElementById('submitForm').onsubmit=e=>{e.preventDefault();let evidence=String(new FormData(e.target).get('evidence')).trim();if(!evidence)return;if(m.check==='Automatische code'&&evidence.toLocaleUpperCase('nl').replace(/Ü/g,'U')!==m.answer.toLocaleUpperCase('nl').replace(/Ü/g,'U')){alert('Die code klopt niet. Probeer opnieuw.');return}let status=m.check==='Automatische code'?'approved':'pending';state.submissions.push({id:uid(),missionId:id,evidence,status});if(status==='approved')state.score+=Number(m.points)||0;save();closeModal();render();alert(status==='approved'?'Code goedgekeurd! Punten toegekend.':'Ingediend. De spelleider moet deze missie nog beoordelen.')}}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='weekend-wars-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;let d=t.dataset;if(d.close){closeModal();return}if(d.tab){state.tab=d.tab;save();render();return}if(d.action==='admin'){state.admin=!state.admin;if(!state.admin&&state.tab==='admin')state.tab='home';save();render();return}if(d.editActivity){editActivity(d.editActivity);return}if(d.editMission){editMission(d.editMission);return}if(d.deleteActivity){if(confirm('Activiteit verwijderen? Gekoppelde missies worden locatie-onafhankelijk.')){state.activities=state.activities.filter(x=>x.id!==d.deleteActivity);state.missions.forEach(m=>{if(m.activityId===d.deleteActivity)m.activityId=''});save();render()}return}if(d.deleteMission){if(confirm('Missie verwijderen?')){state.missions=state.missions.filter(x=>x.id!==d.deleteMission);save();render()}return}if(d.submit){submitMission(d.submit);return}if(d.review){let [id,status]=d.review.split(':'),s=state.submissions.find(x=>x.id===id);if(s&&s.status==='pending'){s.status=status;if(status==='approved'){let m=state.missions.find(x=>x.id===s.missionId);state.score+=Number(m?.points)||0}save();render()}return}if(d.chapter){state.chapter=Math.min(3,Math.max(1,state.chapter+(d.chapter==='next'?1:-1)));save();render();return}if(d.addPack){let text=prompt('Nieuw item voor de paklijst:');if(text?.trim()){state.pack.push({id:uid(),text:text.trim().slice(0,100),done:false});save();render()}return}if(d.removePack){state.pack=state.pack.filter(x=>x.id!==d.removePack);save();render();return}if(d.export){exportData();return}});
document.addEventListener('change',e=>{let id=e.target.dataset.pack;if(id){let p=state.pack.find(x=>x.id===id);if(p){p.done=e.target.checked;save();render()}}});document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});render();
})();
</script></body></html>
