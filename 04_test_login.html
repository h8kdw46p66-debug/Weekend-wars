<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekend Wars – Test login</title><style>body{font:16px system-ui;background:#111;color:#f4f4f4;margin:0;padding:32px 16px}main{max-width:480px;margin:50px auto;padding:28px;background:#202024;border:1px solid #444;border-radius:16px}h1{margin-top:0}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:8px;font:inherit}input{background:#111;color:white;border:1px solid #777}button{background:#c52b3c;color:white;border:0;cursor:pointer}small{color:#bbb}#status{white-space:pre-wrap;line-height:1.5}</style></head><body><main><h1>WEEKEND WARS</h1><p>Test: persoonlijke uitnodiging</p><input id="code" placeholder="WW-..." autocomplete="off" aria-label="Persoonlijke code"><button id="go">Ontgrendel</button><button id="out" style="background:#444">Testsessie wissen</button><p id="status" role="status">Nog niet aangemeld.</p><small>Dit is een aparte testpagina. De bestaande Weekend Wars 6.0 blijft ongewijzigd.</small></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
// Replace ONLY these two public values; NEVER use a service_role or secret key.
const PROJECT_URL='https://zdezfkqmhbociagldlgo.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_c-MVxESLRtAU1xtzZyD1Gg_ytJB18pR';
const status=document.getElementById('status');
if(PROJECT_URL.startsWith('PASTE_'))status.textContent='Vul eerst de project-URL en publishable key in het HTML-bestand in.';
else {
 const sb=createClient(PROJECT_URL,PUBLISHABLE_KEY);
 async function showSession(){const {data:{user},error}=await sb.auth.getUser();if(error||!user)return;const {data}=await sb.from('players').select('display_name,weekend_id').eq('auth_user_id',user.id).maybeSingle();if(data)status.textContent=`Welkom, ${data.display_name}! Je persoonlijke sessie werkt.`;else status.textContent='Gastsessie actief. Voer je uitnodigingscode in.';}
 document.getElementById('go').onclick=async()=>{const btn=document.getElementById('go');btn.disabled=true;status.textContent='Code controleren...';try{let {data:{session},error}=await sb.auth.getSession();
let user=session?.user;if(error)throw new Error('Sessiecontrole: '+error.message);if(!user){const r=await sb.auth.signInAnonymously();if(r.error)throw new Error('Anoniem aanmelden: '+r.error.message);}
const result=await sb.rpc('redeem_weekend_invite',{p_code:document.getElementById('code').value});

if(result.error)throw new Error('Uitnodigingscode: '+result.error.message);

const speler=result.data?.[0];

if(!speler?.player_id){
  throw new Error(speler?.player_name||'Ongeldige of gebruikte uitnodigingscode.');
}

status.textContent=`Welkom, ${speler.player_name}! Je code is geaccepteerd.`;
}catch(e){status.textContent='Niet gelukt: '+e.message;}finally{btn.disabled=false;}};
 document.getElementById('out').onclick=async()=>{await sb.auth.signOut();status.textContent='Sessie gewist. Een gebruikte uitnodigingscode kan niet opnieuw worden ingewisseld.';};
 showSession();
}
</script></body></html>
