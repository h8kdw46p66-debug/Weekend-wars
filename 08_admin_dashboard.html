
<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekend Wars | Spelleider</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{
  margin:0;
  background:#101013;
  color:#f7f7f8;
  font:16px/1.5 system-ui,sans-serif;
}
.wrap{max-width:850px;margin:auto;padding:22px 16px 60px}
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #38383c;
  padding-bottom:14px;
  margin-bottom:28px;
  gap:12px;
}
.logo{font-weight:900;letter-spacing:.12em}
.logo span{color:#e44c5d}
h1{font-size:clamp(28px,6vw,42px);line-height:1.15}
h2{font-size:20px;margin:0 0 14px}
.eyebrow{
  color:#f16b79;
  font-size:12px;
  font-weight:800;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.muted{color:#b8b8bf}
.card{
  background:#1e1e23;
  border:1px solid #393940;
  border-radius:14px;
  padding:20px;
  margin:14px 0;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.stat{font-size:34px;font-weight:800}
input{
  width:100%;
  padding:12px;
  background:#101013;
  color:white;
  border:1px solid #55555d;
  border-radius:9px;
  font:inherit;
  margin:6px 0 15px;
}
label{display:block;font-weight:600}
button{
  font:inherit;
  cursor:pointer;
  border:0;
  border-radius:9px;
  padding:11px 15px;
  background:#b8293c;
  color:white;
}
button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#38383f}
.approve{background:#24734c}
.reject{background:#923541}
.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}
.mission{
  padding:18px 0;
  border-top:1px solid #393940;
}
.mission:first-child{border-top:0}
.status{
  display:inline-block;
  padding:4px 9px;
  border-radius:6px;
  background:#38383f;
  font-size:13px;
}
.notice{
  background:#2a2226;
  border:1px solid #61323a;
  padding:13px;
  border-radius:9px;
  white-space:pre-wrap;
}
.small{font-size:13px}
[hidden]{display:none!important}
@media(max-width:460px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="logo">WEEKEND <span>WARS</span></div>
  <button id="logout" class="secondary" hidden>
    Uitloggen
  </button>
</header>

<div class="eyebrow">Münster 2027 · Spelleider</div>
<h1>Missies beoordelen</h1>
<p class="muted">
  Beheer de ingezonden missies en ken punten toe.
</p>

<div id="message" class="notice" role="status">
  Beveiligde verbinding controleren…
</div>

<section id="login" class="card" hidden>
  <h2>Inloggen als spelleider</h2>
  <form id="loginForm">
    <label for="email">E-mailadres</label>
    <input
      id="email"
      type="email"
      autocomplete="username"
      required
    >

    <label for="password">Wachtwoord</label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
      required
    >

    <button id="loginButton" type="submit">
      Inloggen
    </button>
  </form>
</section>

<div id="dashboard" hidden>
  <p id="adminName" class="muted"></p>

  <div class="grid">
    <div class="card">
      <div class="eyebrow">Openstaand</div>
      <div id="pendingCount" class="stat">0</div>
    </div>
    <div class="card">
      <div class="eyebrow">Beoordeeld</div>
      <div id="reviewedCount" class="stat">0</div>
    </div>
  </div>

  <section class="card">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
      <h2>Te beoordelen missies</h2>
      <button id="refresh" class="secondary">
        Vernieuwen
      </button>
    </div>
    <div id="pendingList"></div>
  </section>

  <section class="card">
    <h2>Eerder beoordeeld</h2>
    <div id="reviewedList"></div>
  </section>

  <p class="muted small">
    Weekend Wars 8.0 · Spelleidersdashboard
  </p>
</div>

</div>

<script type="module">
import {createClient} from
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const URL='https://zdezfkqmhbociagldlgo.supabase.co';
const KEY='sb_publishable_c-MVxESLRtAU1xtzZyD1Gg_ytJB18pR';

const sb=createClient(URL,KEY,{
  auth:{
    storageKey:'weekend-wars-admin-auth'
  }
});

const $=id=>document.getElementById(id);

function showMessage(text){
  $('message').textContent=text;
  $('message').hidden=false;
}

function hideMessage(){
  $('message').hidden=true;
}

function check(error){
  if(error)throw new Error(error.message);
}

function makeText(tag,text,className){
  const el=document.createElement(tag);
  el.textContent=text;
  if(className)el.className=className;
  return el;
}

async function loadDashboard(){
  $('dashboard').hidden=true;
  $('login').hidden=true;
  showMessage('Spelleidersaccount controleren…');

  try{
    // Controleer eerst of er een sessie bestaat.
    const {data:{session},error:sessionError}=
      await sb.auth.getSession();

    check(sessionError);

    if(!session){
      $('login').hidden=false;
      $('logout').hidden=true;
      showMessage('Log in met je spelleidersaccount.');
      return;
    }

    // Controleer de ingelogde gebruiker.
    const {data:{user},error:userError}=
      await sb.auth.getUser();

    check(userError);

    if(!user){
      $('login').hidden=false;
      $('logout').hidden=true;
      showMessage('Log in met je spelleidersaccount.');
      return;
    }

    // De database bepaalt of dit account admin is.
    const {data:profile,error:profileError}=
      await sb.from('players')
        .select('display_name,role')
        .eq('auth_user_id',user.id)
        .maybeSingle();

    check(profileError);

    if(!profile || profile.role!=='admin'){
      showMessage(
        'Dit account heeft geen spelleidersrechten. '+
        'Log uit en gebruik het spelleidersaccount.'
      );
      $('logout').hidden=false;
      return;
    }

    $('adminName').textContent=
      'Ingelogd als '+profile.display_name;

    await loadSubmissions();

    $('logout').hidden=false;
    $('dashboard').hidden=false;
    hideMessage();

  }catch(error){
    showMessage('Laden niet gelukt: '+error.message);
    $('logout').hidden=false;
  }
}

async function loadSubmissions(){
  const {data,error}=await sb.rpc(
    'get_weekend_submissions'
  );

  check(error);

  const submissions=data||[];

  const pending=submissions.filter(
    s=>s.submission_status==='pending'
  );

  const reviewed=submissions.filter(
    s=>s.submission_status!=='pending'
  );

  $('pendingCount').textContent=pending.length;
  $('reviewedCount').textContent=reviewed.length;

  $('pendingList').replaceChildren();
  $('reviewedList').replaceChildren();

  if(!pending.length){
    $('pendingList').append(
      makeText('p','Geen openstaande missies.','muted')
    );
  }

  if(!reviewed.length){
    $('reviewedList').append(
      makeText('p','Nog geen missies beoordeeld.','muted')
    );
  }

  for(const s of pending){
    $('pendingList').append(
      createMissionCard(s,true)
    );
  }

  for(const s of reviewed){
    $('reviewedList').append(
      createMissionCard(s,false)
    );
  }
}

function createMissionCard(s,isPending){
  const box=document.createElement('div');
  box.className='mission';

  box.append(
    makeText('strong',s.player_name),
    makeText('div',s.mission_title),
    makeText(
      'div',
      s.mission_description||'Geen beschrijving',
      'muted'
    ),
    makeText(
      'div',
      s.mission_points+' punten',
      'eyebrow'
    )
  );

  const status=makeText(
    'span',
    s.submission_status==='pending'
      ?'Wacht op beoordeling'
      :s.submission_status==='approved'
        ?'Goedgekeurd'
        :'Afgewezen',
    'status'
  );

  box.append(status);

  if(s.submitted_at){
    box.append(makeText(
      'div',
      'Ingediend: '+
      new Date(s.submitted_at).toLocaleString(
        'nl-NL',
        {dateStyle:'medium',timeStyle:'short'}
      ),
      'muted small'
    ));
  }

  if(isPending){
    const actions=document.createElement('div');
    actions.className='actions';

    const approve=document.createElement('button');
    approve.className='approve';
    approve.textContent='Goedkeuren';

    const reject=document.createElement('button');
    reject.className='reject';
    reject.textContent='Afwijzen';

    const buttons=[approve,reject];

    approve.onclick=()=>reviewMission(
      s,true,buttons
    );

    reject.onclick=()=>reviewMission(
      s,false,buttons
    );

    actions.append(approve,reject);
    box.append(actions);
  }

  return box;
}

async function reviewMission(s,approve,buttons){
  const action=approve?'goedkeuren':'afwijzen';

  if(!confirm(
    'Weet je zeker dat je de missie "'+
    s.mission_title+'" van '+s.player_name+
    '" wilt '+action+'?'
  ))return;

  buttons.forEach(b=>b.disabled=true);
  showMessage('Beoordeling verwerken…');

  try{
    const {error}=await sb.rpc(
      'review_weekend_mission',
      {
        p_submission_id:s.submission_id,
        p_approve:approve
      }
    );

    check(error);

    await loadSubmissions();
    hideMessage();

  }catch(error){
    showMessage(
      'Beoordeling niet gelukt: '+error.message
    );
    buttons.forEach(b=>b.disabled=false);
  }
}

$('loginForm').onsubmit=async event=>{
  event.preventDefault();

  const button=$('loginButton');
  button.disabled=true;
  showMessage('Inloggen…');

  try{
    const {error}=await sb.auth.signInWithPassword({
      email:$('email').value.trim(),
      password:$('password').value
    });

    check(error);

    $('password').value='';
    await loadDashboard();

  }catch(error){
    showMessage('Inloggen mislukt: '+error.message);
  }finally{
    button.disabled=false;
  }
};

$('logout').onclick=async()=>{
  const {error}=await sb.auth.signOut();

  if(error){
    showMessage('Uitloggen mislukt: '+error.message);
    return;
  }

  $('dashboard').hidden=true;
  $('logout').hidden=true;
  $('login').hidden=false;
  showMessage('Je bent uitgelogd.');
};

$('refresh').onclick=async()=>{
  showMessage('Missies vernieuwen…');

  try{
    await loadSubmissions();
    hideMessage();
  }catch(error){
    showMessage('Vernieuwen mislukt: '+error.message);
  }
};

loadDashboard();
</script>
</body>
</html>
