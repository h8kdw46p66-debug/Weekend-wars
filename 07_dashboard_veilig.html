<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekend Wars | Speler</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101013;color:#f7f7f8;font:16px/1.5 system-ui,sans-serif}.wrap{max-width:850px;margin:auto;padding:20px 15px 55px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #393940;padding-bottom:15px}.logo{font-weight:900;letter-spacing:.12em}.logo span{color:#ed5263}h1{font-size:clamp(28px,6vw,40px)}h2{font-size:20px;margin:0 0 10px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.13em;color:#f16b79;text-transform:uppercase}.muted,small{color:#b8b8bf}.card{background:#1e1e23;border:1px solid #393940;border-radius:14px;padding:18px;margin:14px 0}.item{padding:16px 0;border-top:1px solid #393940}.item:first-child{border-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{font-size:32px;font-weight:800}button{background:#b8293c;border:0;border-radius:9px;color:#fff;padding:11px 14px;font:inherit;cursor:pointer}button.secondary{background:#38383f}button.approve{background:#24734c}button.reject{background:#923541}button:disabled{opacity:.5;cursor:not-allowed}input,select{width:100%;padding:11px;margin:8px 0;background:#111115;color:#fff;border:1px solid #55555d;border-radius:8px;font:inherit}label{display:block;margin-top:10px;font-weight:600}.notice{background:#2a2226;border:1px solid #61323a;padding:13px;border-radius:9px;white-space:pre-wrap}.status{color:#ffb2b9;font-size:14px;margin:8px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.lbrow{display:flex;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid #393940}.lbrow.me{background:#342329;border-radius:9px}.lbname{flex:1}.rank{font-size:22px;min-width:36px}.preview{max-width:100%;max-height:340px;border-radius:9px;margin:10px 0}a{color:#ff8992}[hidden]{display:none!important}@media(max-width:460px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header><div class="logo">WEEKEND <span>WARS</span></div><button id="refresh" class="secondary">Vernieuwen</button></header><p class="eyebrow">Münster 2027 · Speler</p><h1 id="welcome">Je dossier wordt geladen…</h1><p class="muted" id="subtitle"></p><div id="message" class="notice">Verbinding controleren…</div><div id="dashboard" hidden><div class="grid"><div class="card"><div class="eyebrow">Jouw punten</div><div id="points" class="stat">0</div></div><div class="card"><div class="eyebrow">Status</div><strong>Speler actief</strong></div></div><section class="card"><h2>🏆 Live klassement</h2><div id="leaderboard"></div><small id="updated"></small></section><section class="card"><h2>Weekendplanning</h2><div id="activities"></div></section><section class="card"><h2>Geheime missies</h2><div id="missions"></div></section><section class="card"><h2>Getuigenverzoeken</h2><p class="muted">Bevestig alleen missies die je zelf hebt gezien.</p><div id="requests"></div></section><small>Weekend Wars 9.0</small></div></div><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://zdezfkqmhbociagldlgo.supabase.co','sb_publishable_c-MVxESLRtAU1xtzZyD1Gg_ytJB18pR',);const $=id=>document.getElementById(id);const check=(e)=>{if(e)throw Error(e.message)};const el=(tag,txt,cls)=>{const x=document.createElement(tag);x.textContent=txt??'';if(cls)x.className=cls;return x};const notice=t=>{$('message').hidden=false;$('message').textContent=t};const clearNotice=()=>{$('message').hidden=true};
let me=null,timer=null,lbBusy=false;
function row(parent,title,detail){const d=el('div','','item');d.append(el('strong',title),el('div',detail,'muted'));parent.append(d)}
async function leaderboard(){if(!me||lbBusy)return;lbBusy=true;try{const {data,error}=await sb.rpc('get_weekend_leaderboard');check(error);$('leaderboard').replaceChildren();(data||[]).forEach((p,i)=>{const r=el('div','','lbrow');if(p.player_name===me.display_name)r.classList.add('me');r.append(el('div',i===0?'🥇':i===1?'🥈':i===2?'🥉':String(i+1),'rank'),el('div',p.player_name+(p.player_name===me.display_name?' (jij)':''),'lbname'),el('strong',p.total_points+' pt'));$('leaderboard').append(r);if(p.player_name===me.display_name)$('points').textContent=p.total_points});$('updated').textContent='Bijgewerkt: '+new Date().toLocaleTimeString('nl-NL')}catch(e){$('updated').textContent='Klassement: '+e.message}finally{lbBusy=false}}
async function requests(){const {data,error}=await sb.rpc('get_weekend_witness_requests');check(error);$('requests').replaceChildren();if(!data?.length)row($('requests'),'Geen verzoeken','Je hebt momenteel niets te bevestigen.');for(const r of data||[]){const d=el('div','','item'),b=el('button','Ik bevestig dit');d.append(el('strong',r.mission_title),el('div','Van: '+r.player_name,'muted'),b);b.onclick=async()=>{if(!confirm('Heb je dit zelf gezien en wil je bevestigen?'))return;b.disabled=true;try{const {error}=await sb.rpc('confirm_weekend_witness',{p_submission_id:r.submission_id});check(error);await requests()}catch(e){notice(e.message);b.disabled=false}};$('requests').append(d)}}
async function submit(a,m,ui){const btn=ui.button;btn.disabled=true;ui.status.textContent='Bewijs verwerken…';let path=null;try{const method=m.verification_method||'admin';if(method==='photo'||method==='video'){const file=ui.file.files[0];if(!file)throw Error('Selecteer eerst een bestand.');const types=method==='photo'?['image/jpeg','image/png','image/webp']:['video/mp4','video/webm','video/quicktime'];if(!types.includes(file.type))throw Error('Bestandstype niet ondersteund. Gebruik JPG/PNG/WebP of MP4/WebM/MOV.');if(file.size>20*1024*1024)throw Error('Bestand is groter dan 20 MB.');const ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp','video/mp4':'mp4','video/webm':'webm','video/quicktime':'mov'})[file.type];path=a.id+'/'+crypto.randomUUID()+'.'+ext;const {error}=await sb.storage.from('mission-evidence').upload(path,file,{contentType:file.type,upsert:false});check(error)}const params={p_assignment_id:a.id,p_evidence_path:path,p_code:method==='code'?ui.code.value:null,p_witness_player_id:method==='witness'?ui.witness.value:null};const {error}=await sb.rpc('submit_weekend_mission_v9',params);check(error);ui.status.textContent='Wacht op beoordeling';btn.textContent='Ingediend';ui.controls.hidden=true}catch(e){ui.status.textContent='Niet gelukt: '+e.message;btn.disabled=false}}
async function load(){if(timer)clearInterval(timer);me=null;$('dashboard').hidden=true;notice('Spelerssessie controleren…');try{const {data:{session},error:se}=await sb.auth.getSession();check(se);if(!session)throw Error('Je bent niet ingelogd. Open eerst het inlogscherm.');const {data:{user},error:ue}=await sb.auth.getUser();check(ue);if(!user)throw Error('Geen geldige sessie.');const {data:p,error:pe}=await sb.from('players').select('id,display_name,weekend_id').eq('auth_user_id',user.id).maybeSingle();check(pe);if(!p)throw Error('Geen spelersprofiel gekoppeld.');me=p;const [{data:w,error:we},{data:activities,error:ae},{data:awards,error:aw},{data:assignments,error:as},{data:candidates,error:ce}]=await Promise.all([sb.from('weekends').select('title,starts_on,ends_on').eq('id',p.weekend_id).single(),sb.from('activities').select('title,location,starts_at').eq('weekend_id',p.weekend_id).order('starts_at'),sb.from('point_awards').select('points').eq('player_id',p.id),sb.from('mission_assignments').select('id,missions(title,description,points,verification_method)').eq('player_id',p.id),sb.rpc('get_weekend_witness_candidates')]);[we,ae,aw,as,ce].forEach(check);const ids=(assignments||[]).map(a=>a.id);let submissions=[];if(ids.length){const {data,error}=await sb.from('submissions').select('assignment_id,status').in('assignment_id',ids);check(error);submissions=data||[]}$('welcome').textContent='Welkom, '+p.display_name+'.';$('subtitle').textContent=w.title+' · '+w.starts_on+(w.ends_on?' t/m '+w.ends_on:'');$('points').textContent=(awards||[]).reduce((sum,a)=>sum+a.points,0);$('activities').replaceChildren();if(!activities?.length)row($('activities'),'Nog geen activiteiten','De planning volgt later.');for(const a of activities||[])row($('activities'),a.title,[a.starts_at?new Date(a.starts_at).toLocaleString('nl-NL'):'',a.location].filter(Boolean).join(' · '));$('missions').replaceChildren();if(!assignments?.length)row($('missions'),'Nog geen geheime missies','De spelleider heeft nog niets vrijgegeven.');for(const a of assignments||[]){if(!a.missions)continue;const m=a.missions,method=m.verification_method||'admin',d=el('div','','item'),status=el('div','','status'),controls=el('div'),btn=el('button','Missie indienen'),ui={button:btn,status,controls};d.append(el('strong',m.title+' · '+m.points+' punten'),el('div',m.description||'Geheime opdracht','muted'),el('div','Bewijs: '+({admin:'Spelleider',photo:'Foto',video:'Video',code:'Geheime code',witness:'Getuige'}[method]||method),'eyebrow'));if(method==='photo'||method==='video'){const label=el('label','Selecteer '+(method==='photo'?'foto':'video')),f=document.createElement('input');f.type='file';f.accept=method==='photo'?'image/jpeg,image/png,image/webp':'video/mp4,video/webm,video/quicktime';label.append(f);controls.append(label);ui.file=f}else if(method==='code'){const label=el('label','Missiecode'),f=document.createElement('input');f.type='text';f.autocomplete='off';label.append(f);controls.append(label);ui.code=f}else if(method==='witness'){const label=el('label','Kies getuige'),select=document.createElement('select');select.append(new Option('Selecteer een deelnemer',''));for(const c of candidates||[])select.append(new Option(c.player_name,c.player_id));label.append(select);controls.append(label);ui.witness=select}controls.append(btn);d.append(status,controls);const existing=submissions.find(s=>s.assignment_id===a.id);if(existing){controls.hidden=true;status.textContent=existing.status==='pending'?'Wacht op beoordeling':existing.status==='approved'?'Goedgekeurd':existing.status==='rejected'?'Afgewezen':existing.status}else{btn.onclick=()=>{if(method==='witness'&&!ui.witness.value){status.textContent='Kies eerst een getuige.';return}if(!confirm('Missie met dit bewijs indienen?'))return;submit(a,m,ui)}}$('missions').append(d)}await requests();$('dashboard').hidden=false;clearNotice();await leaderboard();timer=setInterval(leaderboard,15000)}catch(e){notice('Laden niet gelukt: '+e.message)}}$('refresh').onclick=load;load();
</script></body></html>
